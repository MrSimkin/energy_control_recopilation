name: Statistical Research Validation

on:
  push:
    branches: [ main ]
    paths:
      - "research/statistical_uncertainty/csharp_reference/**"
      - ".github/workflows/statistical-research-validation.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Run direct C# statistical reference fixtures
        run: >
          dotnet run
          --project research/statistical_uncertainty/csharp_reference/SolarOfThings.StatisticalReference.csproj
          --configuration Release
