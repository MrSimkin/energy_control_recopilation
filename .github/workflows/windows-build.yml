name: Windows Build

on:
  push:
    branches: [ main ]
    paths:
      - "src/**"
      - "tools/**"
      - "SolarOfThings.sln"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "global.json"
      - ".github/workflows/windows-build.yml"
  pull_request:
    paths:
      - "src/**"
      - "tools/**"
      - "SolarOfThings.sln"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "global.json"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore SolarOfThings.sln

      - name: Build
        run: dotnet build SolarOfThings.sln --configuration Release --no-restore

      - name: SQLite smoke test
        run: dotnet run --project tools/SolarOfThings.SmokeTest/SolarOfThings.SmokeTest.csproj --configuration Release --no-build

      - name: Publish portable Windows x64 test build
        run: >
          dotnet publish src/SolarOfThings.App/SolarOfThings.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:Platform=x64
          --output artifacts/SolarEnergyMonitor-win-x64

      - name: Mark test build as portable
        shell: pwsh
        run: New-Item -Path "artifacts/SolarEnergyMonitor-win-x64/portable.mode" -ItemType File -Force

      - name: Upload portable test build
        uses: actions/upload-artifact@v4
        with:
          name: SolarEnergyMonitor-win-x64-dev
          path: artifacts/SolarEnergyMonitor-win-x64
          if-no-files-found: error
