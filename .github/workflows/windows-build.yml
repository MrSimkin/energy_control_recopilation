name: Windows Build

on:
  push:
    branches: [ main ]
    paths:
      - "src/**"
      - "tools/**"
      - "SolarOfThings.sln"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "global.json"
      - ".github/workflows/windows-build.yml"
  pull_request:
    paths:
      - "src/**"
      - "tools/**"
      - "SolarOfThings.sln"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "global.json"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore SolarOfThings.sln

      - name: Build
        run: dotnet build SolarOfThings.sln --configuration Release --no-restore

      - name: SQLite smoke test
        run: dotnet run --project tools/SolarOfThings.SmokeTest/SolarOfThings.SmokeTest.csproj --configuration Release --no-build
